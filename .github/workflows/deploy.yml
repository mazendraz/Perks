name: Deploy (manual)

# Manual only. There is intentionally NO push / pull_request / schedule trigger.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA to deploy (defaults to the commit this run was started on)
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_SHA: ${{ inputs.sha || github.sha }}
    steps:
      - name: Require passing fast checks for the exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if ! [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Deploy needs a full 40-character commit SHA." >&2
            exit 1
          fi
          # Only the "Fast checks" job of checks.yml (typecheck, lint, unit tests, build) gates a
          # deploy. The full suite (integration, e2e, mobile, monitoring) is reported, not required.
          runs="$(gh api "repos/$REPO/actions/workflows/checks.yml/runs?head_sha=$DEPLOY_SHA&per_page=20" --jq '.workflow_runs[].id')"
          fast="missing"
          full="missing"
          for id in $runs; do
            jobs="$(gh api "repos/$REPO/actions/runs/$id/jobs?per_page=100")"
            fast="$(jq -r '[.jobs[] | select(.name == "Fast checks")][0] | if . == null then "missing" else (.conclusion // .status) end' <<<"$jobs")"
            full="$(jq -r '[.jobs[] | select(.name == "Full suite")][0] | if . == null then "missing" else (.conclusion // .status) end' <<<"$jobs")"
            [[ "$fast" == "success" ]] && break
          done
          if [[ "$fast" != "success" ]]; then
            echo "Fast checks for $DEPLOY_SHA: $fast. Only a commit with passing fast checks can be deployed." >&2
            exit 1
          fi
          if [[ "$full" != "success" ]]; then
            echo "::warning::Full suite (integration/e2e/mobile/monitoring) for $DEPLOY_SHA is '$full'. Not blocking this deploy."
          fi
          echo "Deploying $DEPLOY_SHA (fast checks: success, full suite: $full)."

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Run deploy.sh on the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" "bash /opt/perks/scripts/deploy.sh $DEPLOY_SHA"
