name: nuqta
x-logging: &logging
  driver: json-file
  options: { max-size: 20m, max-file: '5' }
x-app: &app
  image: ${NUQTA_IMAGE:-nuqta-app:local}
  build: { context: .., target: runtime }
  user: '1000:1000'
  read_only: true
  tmpfs: ['/tmp:rw,noexec,nosuid,size=64m']
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging: *logging
x-environment: &environment
  APP_ENV: ${APP_ENV:-production}
  AUTH_PROVIDER: password
  COOKIE_SECURE: 'true'
  HOST: 0.0.0.0
  PORT: '4100'
  PUBLIC_APP_ORIGIN: ${PUBLIC_APP_ORIGIN:?Run init-secrets and configure the domain}
  AUTH_PEPPER: ${AUTH_PEPPER:?Required}
  STORAGE_ROOT: /var/lib/nuqta/files
  LOG_LEVEL: info
  MAIL_TRANSPORT: smtp
  SMTP_HOST: ${SMTP_HOST:?Choose SMTP provider}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:?Required}
  SMTP_PASS: ${SMTP_PASS:?Required}
  SMTP_FROM: ${SMTP_FROM:?Required}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_STARTTLS: 'true'
services:
  postgres:
    image: ${NUQTA_POSTGRES_IMAGE:-nuqta-postgres:local}
    build: { context: .., dockerfile: deploy/postgres/Dockerfile }
    restart: unless-stopped
    stop_grace_period: 1m
    shm_size: 256m
    command: [postgres, -c, config_file=/etc/nuqta/postgresql.conf]
    environment:
      POSTGRES_PASSWORD: ${NUQTA_POSTGRES_DB_PASSWORD:?Required}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      NUQTA_MIGRATOR_DB_PASSWORD: ${NUQTA_MIGRATOR_DB_PASSWORD:?Required}
      NUQTA_RUNTIME_DB_PASSWORD: ${NUQTA_RUNTIME_DB_PASSWORD:?Required}
      NUQTA_AUTH_DB_PASSWORD: ${NUQTA_AUTH_DB_PASSWORD:?Required}
      NUQTA_WORKER_DB_PASSWORD: ${NUQTA_WORKER_DB_PASSWORD:?Required}
      PGBACKREST_REPO1_CIPHER_PASS: ${PGBACKREST_REPO1_CIPHER_PASS:?Private backup key required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-nuqta-roles.sh:ro
      - postgres_socket:/var/run/postgresql
      - database_repository:/var/lib/pgbackrest
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U postgres -d nuqta']
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging
  database_backup:
    image: ${NUQTA_POSTGRES_IMAGE:-nuqta-postgres:local}
    build: { context: .., dockerfile: deploy/postgres/Dockerfile }
    restart: unless-stopped
    user: '999:999'
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=128m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    entrypoint: [python3, /opt/nuqta-backup/db-loop.py]
    environment:
      PGBACKREST_REPO1_CIPHER_PASS: ${PGBACKREST_REPO1_CIPHER_PASS:?Private backup key required}
    volumes:
      - postgres_data:/var/lib/postgresql/data:ro
      - postgres_socket:/var/run/postgresql
      - database_repository:/var/lib/pgbackrest
      - database_backup_state:/var/lib/nuqta-backup-state
    networks: [database]
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck:
      test:
        [
          CMD,
          python3,
          -c,
          "import json,time;v=json.load(open('/var/lib/nuqta-backup-state/status.json'));assert v['healthy'] and time.time()*1000-v['checkedAt']<300000",
        ]
      interval: 60s
      timeout: 5s
      start_period: 5m
      retries: 3
    logging: *logging
  files_backup:
    image: ${NUQTA_POSTGRES_IMAGE:-nuqta-postgres:local}
    build: { context: .., dockerfile: deploy/postgres/Dockerfile }
    restart: unless-stopped
    user: '1000:1000'
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    entrypoint: [sh, /opt/nuqta-backup/files-loop.sh]
    environment:
      STORAGE_ROOT: /var/lib/nuqta/files
      RESTIC_REPOSITORY: /var/lib/restic
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?Private file backup key required}
      NUQTA_FILE_BACKUP_STATE: /var/lib/nuqta-file-backup-state/status.json
    volumes:
      - files:/var/lib/nuqta/files:ro
      - files_repository:/var/lib/restic
      - files_backup_state:/var/lib/nuqta-file-backup-state
    network_mode: none
    healthcheck:
      test:
        [
          CMD,
          python3,
          -c,
          "import json,time;v=json.load(open('/var/lib/nuqta-file-backup-state/status.json'));assert v['healthy'] and time.time()*1000-v['lastBackupAt']<93600000",
        ]
      interval: 60s
      timeout: 5s
      start_period: 5m
      retries: 3
    logging: *logging
  migrate:
    <<: *app
    # A one-shot gate: successful exit, rather than a persistent healthcheck/restart.
    restart: 'no'
    command: [node, dist/db/migrate.js]
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_MIGRATOR_URL: postgresql://nuqta_migrator:${NUQTA_MIGRATOR_DB_PASSWORD}@postgres:5432/nuqta
    networks: [database]
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck: { disable: true }
  restore_drill:
    profiles: [manual-drill]
    image: ${NUQTA_POSTGRES_IMAGE:-nuqta-postgres:local}
    build: { context: .., dockerfile: deploy/postgres/Dockerfile }
    restart: 'no'
    user: '999:999'
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=128m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    entrypoint: [sh, /opt/nuqta-backup/restore-drill.sh]
    environment:
      PGBACKREST_REPO1_CIPHER_PASS: ${PGBACKREST_REPO1_CIPHER_PASS:?Private backup key required}
      NUQTA_RESTORE_ROOT: /var/lib/nuqta-restore
      NUQTA_RESTORE_EXPECTED: /drill-input/expected.json
      NUQTA_RESTORE_REPORT: /var/lib/nuqta-restore/report.json
      NUQTA_RESTORE_SET: ${NUQTA_RESTORE_SET:-}
      NUQTA_RESTORE_TARGET_TIME: ${NUQTA_RESTORE_TARGET_TIME:-}
    volumes:
      - database_repository:/var/lib/pgbackrest:ro
      - /var/lib/nuqta-restore
    network_mode: none
    healthcheck: { disable: true }
    logging: *logging
  api:
    <<: *app
    restart: unless-stopped
    environment:
      <<: *environment
      TRUSTED_PROXIES: 172.30.40.2/32
      DATABASE_URL: postgresql://nuqta_runtime:${NUQTA_RUNTIME_DB_PASSWORD}@postgres:5432/nuqta
      AUTH_DATABASE_URL: postgresql://nuqta_auth:${NUQTA_AUTH_DB_PASSWORD}@postgres:5432/nuqta
      MONITORING_TOKEN: ${MONITORING_TOKEN:?Independent operations token required}
      BACKUP_STATUS_ROOT: /var/lib/nuqta/backup-health
    volumes:
      - files:/var/lib/nuqta/files
      - database_backup_state:/var/lib/nuqta/backup-health/database:ro
      - files_backup_state:/var/lib/nuqta/backup-health/files:ro
    networks:
      database: {}
      proxy: { ipv4_address: 172.30.40.3 }
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:4100/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
  worker:
    <<: *app
    restart: unless-stopped
    command: [node, dist/apps/worker/src/main.js]
    environment:
      <<: *environment
      WORKER_DATABASE_URL: postgresql://nuqta_worker:${NUQTA_WORKER_DB_PASSWORD}@postgres:5432/nuqta
    volumes: [files:/var/lib/nuqta/files]
    networks: [database, mail_egress]
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "const f=require('node:fs');process.exit(Date.now()-f.statSync('/tmp/nuqta-worker-heartbeat').mtimeMs<90000?0:1)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
  monitoring:
    image: louislam/uptime-kuma:2.5.9-slim-rootless
    restart: unless-stopped
    user: '1000:1000'
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      UPTIME_KUMA_HOST: 0.0.0.0
      UPTIME_KUMA_PORT: '3001'
      UPTIME_KUMA_DB_TYPE: sqlite
      DATA_DIR: /app/data
    ports: ['127.0.0.1:4301:3001']
    volumes: [monitoring_data:/app/data]
    networks: [proxy, monitoring_egress]
    depends_on: { api: { condition: service_healthy } }
    healthcheck:
      test: [CMD, /app/extra/healthcheck]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging: *logging
  caddy:
    image: ${NUQTA_WEB_IMAGE:-nuqta-web:local}
    build: { context: .., target: web }
    restart: unless-stopped
    user: '1000:1000'
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    environment: { DOMAIN: '${DOMAIN:?Choose domain}' }
    ports: ['${HTTP_BIND:-80}:80', '${HTTPS_BIND:-443}:443', '${HTTPS_BIND:-443}:443/udp']
    volumes: [caddy_data:/data, caddy_config:/config]
    networks:
      proxy: { ipv4_address: 172.30.40.2 }
    depends_on: { api: { condition: service_healthy } }
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:2019/config/']
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging
networks:
  database: { internal: true }
  proxy: { ipam: { config: [{ subnet: 172.30.40.0/28 }] } }
  mail_egress: {}
  monitoring_egress: {}
volumes:
  postgres_data: {}
  files: {}
  caddy_data: {}
  caddy_config: {}
  postgres_socket: {}
  database_repository: {}
  database_backup_state: {}
  files_repository: {}
  files_backup_state: {}
  monitoring_data: {}
