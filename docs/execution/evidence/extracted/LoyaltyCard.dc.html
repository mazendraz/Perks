<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div role="img" aria-label="{{ aria }}" style="position:relative; overflow:hidden; border-radius:18px; padding:20px; display:flex; flex-direction:column; gap:16px; background:{{ bg }}; color:{{ fg }}; border:1px solid {{ border }}; box-shadow:0 1px 2px rgba(20,20,20,.06), 0 8px 24px rgba(20,20,20,.08); font-family:'Geist','IBM Plex Sans Arabic',system-ui,sans-serif; min-height:200px; box-sizing:border-box">
  <div style="display:flex; align-items:center; gap:12px">
    <div style="width:44px; height:44px; flex:none; border-radius:12px; display:grid; place-items:center; font-weight:700; font-size:20px; background:{{ logoBg }}; color:{{ logoFg }}">{{ initials }}</div>
    <div style="min-width:0; flex:1; display:flex; flex-direction:column; gap:2px">
      <div style="font-weight:600; font-size:16px; line-height:1.3; overflow:hidden; text-overflow:ellipsis; white-space:nowrap">{{ name }}</div>
      <div style="font-size:12px; opacity:.8">{{ programName }}</div>
    </div>
    <div style="font-size:13px; font-weight:500; opacity:.9; white-space:nowrap">{{ alias }}</div>
  </div>
  <div style="display:grid; grid-template-columns:repeat({{ cols }}, minmax(0,1fr)); gap:8px">
    <sc-for list="{{ dots }}" as="d" hint-placeholder-count="5">
      <div style="aspect-ratio:1; border-radius:999px; display:grid; place-items:center; font-size:12px; font-weight:600; background:{{ d.bg }}; color:{{ d.fg }}; border:1.5px {{ d.borderStyle }} {{ d.border }}; transition:background .3s ease">{{ d.label }}</div>
    </sc-for>
  </div>
  <div style="display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap">
    <div style="display:flex; flex-direction:column; gap:2px; min-width:0">
      <div style="font-size:12px; opacity:.8">{{ progressText }}</div>
      <div style="font-size:14px; font-weight:600">{{ reward }}</div>
    </div>
    <sc-if value="{{ hasBadge }}" hint-placeholder-val="{{ false }}">
      <div style="font-size:12px; font-weight:600; padding:4px 10px; border-radius:999px; background:{{ logoBg }}; color:{{ logoFg }}">{{ badge }}</div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:240},&quot;merchantName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;بن وحكاية&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;initials&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;ب&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;programName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;قهوتك السادسة علينا&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;alias&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;سارة م.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;primary&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#6F3F22&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#E2A85B&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;surface&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#FBF5EE&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;template&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;classic&quot;,&quot;minimal&quot;,&quot;bold&quot;],&quot;default&quot;:&quot;classic&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;stamps&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:4,&quot;min&quot;:0,&quot;max&quot;:12,&quot;tsType&quot;:&quot;number&quot;},&quot;threshold&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:5,&quot;min&quot;:1,&quot;max&quot;:12,&quot;tsType&quot;:&quot;number&quot;},&quot;reward&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;أي مشروب ساخن مجانًا&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;progressText&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;badge&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const primary = p.primary || '#6F3F22', accent = p.accent || '#E2A85B', surface = p.surface || '#FBF5EE';
    const tpl = p.template || 'classic';
    const th = Math.max(1, +(p.threshold ?? 5)), st = Math.min(th, Math.max(0, +(p.stamps ?? 0)));
    const T = {
      classic: { bg: primary, fg: '#FFFFFF', border: primary, logoBg: accent, logoFg: primary, on: accent, onFg: primary, off: 'rgba(255,255,255,.14)', offB: 'rgba(255,255,255,.45)' },
      minimal: { bg: '#FFFFFF', fg: '#17181C', border: '#E6E4DF', logoBg: primary, logoFg: '#FFFFFF', on: primary, onFg: '#FFFFFF', off: surface, offB: primary },
      bold: { bg: surface, fg: '#17181C', border: accent, logoBg: primary, logoFg: accent, on: accent, onFg: primary, off: '#FFFFFF', offB: primary }
    }[tpl] || {};
    const dots = Array.from({ length: th }, (_, i) => {
      const on = i < st;
      return { bg: on ? T.on : T.off, fg: on ? T.onFg : 'transparent', border: on ? T.on : T.offB, borderStyle: on ? 'solid' : 'dashed', label: on ? '✓' : '' };
    });
    return {
      ...T, dots, cols: th > 6 ? Math.ceil(th / 2) : th,
      name: p.merchantName || 'Merchant', initials: p.initials || 'M', alias: p.alias || '', programName: p.programName || '',
      reward: p.reward || '', progressText: p.progressText || `${st} / ${th}`,
      badge: p.badge || '', hasBadge: !!p.badge, aria: (p.merchantName || '') + ' — ' + (p.progressText || `${st}/${th}`)
    };
  }
}
</script>
</body>
</html>
